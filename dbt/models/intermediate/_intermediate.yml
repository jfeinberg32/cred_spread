version: 2

models:
  - name: int_spread__features
    description: >
      Joins HY and IG OAS with rolling statistical features.
      Produces z-scores, momentum, and volatility signals.
    columns:
      - name: date
        tests: [not_null, unique]
      - name: hy_oas
        tests: [not_null]
      - name: ig_oas
        # Warn rather than error. The two ICE BofA series do not always
        # publish on the same days — 2024-12-24 has an HY print with no IG
        # print — so isolated gaps are a property of the source, not a
        # defect. mart_regime__features already drops rows with a null
        # ig_oas, so nothing missing ever reaches the HMM. Erroring here
        # would halt the whole pipeline over a single holiday.
        tests:
          - not_null:
              config:
                severity: warn

  - name: int_spread__cross_asset
    description: >
      Joins spread features with VIX, yield curve, and TED spread.
    columns:
      - name: date
        tests: [not_null, unique]